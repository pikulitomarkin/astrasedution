upstream astra_app {
    server app:3000;
    keepalive 32;
}

upstream astra_api {
    server api:8000;
    keepalive 16;
}

# HTTP — ACME challenge + redirect para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name astrasedution.com www.astrasedution.com;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://astrasedution.com$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name astrasedution.com www.astrasedution.com;

    ssl_certificate     /etc/letsencrypt/live/astrasedution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrasedution.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    # Redirect www → apex (quando DNS de www apontar para a VPS)
    if ($host = www.astrasedution.com) {
        return 301 https://astrasedution.com$request_uri;
    }

    location /api/v1/ {
        proxy_pass http://astra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://astra_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://astra_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/health {
        proxy_pass http://astra_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
