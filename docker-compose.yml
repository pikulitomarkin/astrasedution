services:
  db:
    image: postgres:16-alpine
    container_name: astra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-astraseduction}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-astraseduction}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astra-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-astraseduction}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      FREE_PLAN_CREDITS: ${FREE_PLAN_CREDITS:-3}
      RECHARGE_BONUS_CREDITS: ${RECHARGE_BONUS_CREDITS:-1000}
      RECHARGE_BONUS_PRICE_BRL_CENTS: ${RECHARGE_BONUS_PRICE_BRL_CENTS:-4900}
      PAYMENT_MODE: ${PAYMENT_MODE:-instant}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      EMAIL_DEV_EXPOSE_LINK: ${EMAIL_DEV_EXPOSE_LINK:-false}
      EMAIL_VERIFICATION_EXPIRE_HOURS: ${EMAIL_VERIFICATION_EXPIRE_HOURS:-24}
      PASSWORD_RESET_EXPIRE_HOURS: ${PASSWORD_RESET_EXPIRE_HOURS:-2}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Astra Seduction <noreply@astrasedution.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@astrasedution.com}
      SMTP_TLS: ${SMTP_TLS:-true}
      GENERATIONS_DIR: /app/data/generations
      RATE_LIMIT_REGISTER_PER_MINUTE: ${RATE_LIMIT_REGISTER_PER_MINUTE:-5}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_GENERATE_PER_MINUTE: ${RATE_LIMIT_GENERATE_PER_MINUTE:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - generation_data:/app/data/generations
    networks:
      - astra-net
    expose:
      - "8000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-astraseduction}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: astra-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-astraseduction}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - astra-net
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: astra-nginx
    restart: unless-stopped
    depends_on:
      - app
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - astra-net

volumes:
  postgres_data:
  generation_data:

networks:
  astra-net:
    driver: bridge
